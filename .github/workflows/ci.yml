name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solver:
    name: solver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :solver:test
