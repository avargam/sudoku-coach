name: Release

# Publica la APK firmada (D-23, tarea P.3): al subir un tag vX.Y.Z compila la release con la clave de los
# secretos del repo, verifica la firma y crea la Release de GitHub con una APK por ABI, sus SHA-256 y las notas
# del CHANGELOG. Solo corre en tags, nunca en PRs, así que los secretos no llegan a código de forks.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: compila, firma y publica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Versión del tag
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::El tag $tag no es una versión vX.Y.Z (con sufijo opcional, como v0.5.0-rc.1)"
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Con sufijo (v0.0.0-test, v0.5.0-rc.1), la Release se marca como prerelease.
          if [[ "$version" == *-* ]]; then echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6

      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.SUDOKUCOACH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto SUDOKUCOACH_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Compila la release
        env:
          SUDOKUCOACH_VERSION: ${{ steps.version.outputs.version }}
          SUDOKUCOACH_KEYSTORE: ${{ runner.temp }}/release.jks
          SUDOKUCOACH_KEYSTORE_PASSWORD: ${{ secrets.SUDOKUCOACH_KEYSTORE_PASSWORD }}
          SUDOKUCOACH_KEY_ALIAS: ${{ secrets.SUDOKUCOACH_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease

      - name: Verifica la firma y prepara los archivos
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          mkdir dist
          for abi in arm64-v8a x86_64; do
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            "$apksigner" verify --print-certs "$apk"
            cp "$apk" "dist/sudoku-coach-$VERSION-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Notas del CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # El apartado "## [X.Y.Z]" hasta el siguiente "## ". Sin apartado (tags de prueba), una nota mínima.
          awk -v v="$VERSION" '$0 == "## [" v "]" { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Build $VERSION." > notes.md; fi
          cat >> notes.md <<'EOF'

          ### Install

          Download `sudoku-coach-*-arm64-v8a.apk` on an Android 8+ phone and open it; Android will ask you to allow installing apps from your browser or file manager. The `x86_64` APK is for the Android emulator on a PC. SHA-256 checksums are in `SHA256SUMS.txt`.
          EOF
          cat notes.md

      - name: Crea la Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Sudoku Coach $VERSION" --notes-file notes.md ${{ steps.version.outputs.prerelease }}

      - name: Borra la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
